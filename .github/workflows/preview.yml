name: Preview Image

# Builds and pushes a preview Docker image to GHCR whenever a PR is opened,
# updated, or reopened. The image is tagged with the source branch and PR number
# so it is easy to identify and pull for testing.
#
# Tag format: ghcr.io/gummigroda/teslabuddy:preview-<branch>-<pr-number>
# Example:    ghcr.io/gummigroda/teslabuddy:preview-feature-add-tls-42

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  publish-preview:
    name: Publish preview image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Sanities branch name for use as Docker tag
        id: branch
        run: |
          SAFE=$(echo "${{ github.head_ref }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=${SAFE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:preview-${{ steps.branch.outputs.name }}-${{ github.event.pull_request.number }}
            ghcr.io/${{ github.repository }}:latest-preview
