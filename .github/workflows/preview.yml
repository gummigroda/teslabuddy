name: Preview Image

# Builds and pushes a preview Docker image to GHCR whenever code is pushed to a
# feature or fix branch. The image is tagged preview-<branch>-<short-sha> and can
# be used for testing before a PR is merged.
#
# Example tag: ghcr.io/gummigroda/teslabuddy:preview-feature-my-thing-a1b2c3d

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"

jobs:
  publish-preview:
    name: Publish preview image
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Sanitise branch name for use as Docker tag
        id: branch
        run: |
          SAFE=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "name=${SAFE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push preview image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ github.repository }}:preview-${{ steps.branch.outputs.name }}-${{ steps.sha.outputs.short }}
